[pytest]
testpaths = tests
asyncio_mode = auto

# Coverage
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html:coverage-report
    --cov-fail-under=80

# Markers
markers =
    unit: Pure unit tests — no DB, no HTTP
    integration: Integration tests — real DB + HTTP via TestClient
